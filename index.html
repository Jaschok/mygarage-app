:root{--bg:#0E1114;--side:#12161A;--card:#171B20;--line:#232A31;--line2:#3B4650;--txt:#E9EDF0;--mut:#9AA6AF;--mut2:#B4BEC6;--acc:#FFB43B;--ink:#0E1114;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
button{cursor:pointer}
h1,h2,.cond{font-family:"MG Cond","Arial Narrow","Roboto Condensed",sans-serif;font-weight:700}
.app{display:flex;min-height:100vh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.mtop,.mnav,.scrim{display:none}
aside{flex:0 0 272px;min-width:240px;background:var(--side);padding:32px 20px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh;align-self:flex-start;overflow-y:auto}
.logo{font-size:28px;letter-spacing:.06em;color:var(--acc);padding:0 8px;display:flex;align-items:center;gap:12px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px}
.vbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:56px;padding:12px 16px;border-radius:12px;border:2px solid #2A323A;background:transparent;color:var(--txt);width:100%}
.vbtn.on{border-color:var(--acc);background:var(--acc);color:var(--ink)}
.vbtn b{font-size:17px;font-weight:600}.vbtn span{font-size:13px;opacity:.75}
.nbtn{text-align:left;min-height:48px;padding:0 16px;border-radius:12px;border:0;font-size:17px;font-weight:600;background:transparent;color:#C9D2D8;width:100%}
.nbtn.on{background:#232A31;color:var(--acc)}
.ghost{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line2);background:transparent;color:var(--txt);font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.ghost:hover{border-color:var(--acc)}
.prim{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--acc);color:var(--ink);font-weight:700}
.dash{justify-content:center;border-style:dashed}
main{flex:1 1 auto;min-width:0;padding:36px 48px 48px;display:flex;flex-direction:column;gap:28px}
.card{background:var(--card);border-radius:20px}
.head{display:flex;flex-wrap:wrap;gap:28px;padding:24px}
.hinfo{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:16px}
.hname{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
h1{margin:0;font-size:42px;line-height:1.1}
.plate{font-size:20px;letter-spacing:.14em;background:#F2F4F5;color:var(--ink);padding:4px 14px;border-radius:6px}
.facts{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-end}
.big{font-size:40px;line-height:1.1}
.plus{width:48px;height:48px;border-radius:12px;border:0;background:var(--acc);color:var(--ink);font-size:26px;font-weight:700;line-height:1}
.schein{flex:0 0 240px;display:flex;flex-direction:column;gap:10px}
.sthumb{width:240px;height:150px;border:0;padding:0;border-radius:14px;cursor:pointer;background:#E9EDF0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#55616A;font-size:13px;font-weight:600}
.sthumb img{width:100%;height:100%;object-fit:contain}
h2{margin:0;font-size:26px;letter-spacing:.03em}
.shead{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.amp{padding:22px;display:flex;flex-direction:column;gap:10px}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;display:block}
.ok{background:#12301F;color:#9CF0BC}.ok i{background:#4ADE80}
.warn{background:#38300E;color:#FBE27A}.warn i{background:#FACC15}
.bad{background:#3A1A1A;color:#FCA5A5}.bad i{background:#F87171}
.none{background:#232A31;color:var(--mut2)}.none i{background:#6B7782}
.t20{font-size:20px;font-weight:600}.mut{color:var(--mut)}.mut2{color:var(--mut2)}
.list{padding:6px 22px}
.li{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.lirow{cursor:pointer}
.lirow:hover .t20{color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:10px}
.fbtn{min-height:44px;padding:0 18px;border-radius:999px;font-weight:600;border:1.5px solid var(--line2);background:transparent;color:var(--txt)}
.fbtn.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.search{flex:1 1 260px;min-width:0;min-height:46px;border-radius:10px;border:1.5px solid var(--line2);background:#0E1114;color:var(--txt);padding:0 14px;font-size:16px}
.search:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.tl{display:flex;gap:20px}
.tl .rail{flex:0 0 18px;display:flex;flex-direction:column;align-items:center}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--acc);margin-top:22px}
.tl .ln{flex:1;width:2px;background:#2A323A}
.entry{flex:1;min-width:0;padding:18px 22px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.note{white-space:pre-wrap;overflow-wrap:anywhere}
.clip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--acc);background:none;border:0;padding:8px;min-height:44px}
.spec{padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.spec input{background:transparent;border:0;border-bottom:1.5px solid var(--line2);color:var(--txt);font-size:19px;font-weight:600;padding:6px 0;min-height:44px;width:100%}
.spec input:focus{outline:0;border-color:var(--acc)}
.docs{display:flex;flex-wrap:wrap;gap:16px}
.doc{flex:1 1 260px;padding:18px;display:flex;gap:16px;align-items:center}
.thumb{flex:0 0 92px;width:92px;height:66px;border-radius:8px;background:#E9EDF0;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#55616A;font-size:12px;font-weight:600;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.pdfb{font-weight:800;letter-spacing:.08em;color:#B3261E;font-size:15px}
.pdfbig{flex:none;width:64px;height:64px;border-radius:10px;background:#F2F4F5;display:flex;align-items:center;justify-content:center}
.fstrip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.fitem{position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;background:#E9EDF0;display:flex;align-items:center;justify-content:center;color:#55616A;font-size:12px;font-weight:600}
.fitem img{width:100%;height:100%;object-fit:cover}
.fx{position:absolute;top:3px;right:3px;width:30px;height:30px;border-radius:15px;border:0;background:rgba(14,17,20,.85);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.empty{padding:28px;text-align:center;color:var(--mut)}
.banner{padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1.5px solid #6B5A1E;background:#1E1A10}
.ctab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ctab th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:right;padding:14px 0 10px 12px}
.ctab td{padding:12px 0 12px 12px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.ctab th:first-child,.ctab td:first-child{text-align:left;padding-left:0}
.ctab td:last-child{font-weight:700}
dialog{border:0;border-radius:20px;background:#1B2127;color:var(--txt);padding:28px;width:min(520px,94vw);max-height:92vh;overflow:auto}
dialog.wide{width:min(900px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{margin-bottom:18px}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--mut2)}
.f input,.f select,.f textarea{min-height:46px;border-radius:10px;border:1.5px solid var(--line2);background:#0E1114;color:var(--txt);padding:0 12px;font-size:16px;width:100%}
.f textarea{padding:10px 12px;min-height:70px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--acc);border-color:var(--acc)}
.frow{display:flex;gap:12px}.frow .f{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;margin-bottom:10px;font-weight:600}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--acc)}
.sub{padding:14px 16px;margin-bottom:14px;background:#12161A;border-radius:14px}
.acts{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;flex-wrap:wrap}
.cin{flex:1;min-width:0;min-height:46px;border-radius:10px;border:1.5px solid var(--line2);background:#0E1114;color:var(--txt);padding:0 12px;font-size:16px}
.app.setup #vblock,.app.setup #navblock,.app.setup .mveh,.app.setup .mnav{display:none !important}
.welcome{padding:24px;max-width:560px;width:100%;align-self:center}
.mv{min-width:44px;min-height:44px;background:transparent;border:0;color:var(--mut2);display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:0}
.mv:hover{color:var(--acc)}
.warnmsg{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#38300E;color:#FBE27A;font-weight:600;font-size:14px}
[data-card]{cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[data-card] input{-webkit-user-select:text;user-select:text;cursor:text}
[data-card].lift{position:relative;z-index:60;cursor:grabbing;box-shadow:0 18px 40px rgba(0,0,0,.55);transition:none;outline:2px solid var(--acc)}
.imgview{max-width:100%;max-height:75vh;border-radius:10px;display:block;margin:0 auto;background:#E9EDF0}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:#F2F4F5;color:var(--ink);padding:10px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;align-items:center;gap:14px;z-index:90;max-width:92vw}
.toast.show{opacity:1}
.toast.show.act{pointer-events:auto;padding-right:10px}
.toast button{min-height:40px;border:0;border-radius:8px;background:var(--ink);color:#fff;font-weight:700;padding:0 14px;flex:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(min-width:1300px){.head{flex-wrap:nowrap}.hinfo{flex:0 1 auto;min-width:300px}}
@media(max-width:1100px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){
  .app{display:block}
  .mtop{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;z-index:40;background:var(--side);padding:calc(10px + var(--st)) 12px 10px;border-bottom:1px solid var(--line)}
  .mrow{display:flex;align-items:center;gap:6px}
  .mlogo{font-size:22px;letter-spacing:.06em;color:var(--acc);display:flex;align-items:center;gap:8px}
  .mveh{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .mveh::-webkit-scrollbar,.mnav::-webkit-scrollbar{display:none}
  .mveh button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;color:var(--txt);font-weight:600;white-space:nowrap}
  .mveh button.on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
  aside{position:fixed;top:0;left:0;height:100vh;height:100dvh;max-height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;width:min(320px,86vw);z-index:70;transform:translateX(-105%);transition:transform .22s ease;padding:calc(24px + var(--st)) 18px calc(72px + var(--sb))}
  aside>*{flex-shrink:0}
  .app.menu aside{transform:none;box-shadow:12px 0 40px rgba(0,0,0,.5)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:65}
  .app.menu .scrim{display:block}
  main{padding:16px 14px calc(32px + var(--sb));gap:22px}
  .mnav{display:flex;gap:6px;margin:0 -12px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
  .mnav button{flex:none;min-height:42px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:#C9D2D8;font-weight:600;font-size:16px;white-space:nowrap}
  .mnav button.on{background:#232A31;color:var(--acc)}
  .head{padding:16px;gap:16px}
  h1{font-size:30px}
  .plate{font-size:17px;padding:3px 10px}
  .big{font-size:30px}
  .plus{width:42px;height:42px;font-size:24px}
  .facts{gap:16px 24px}
  .schein{flex:1 1 100%;display:grid;grid-template-columns:120px 1fr;column-gap:14px;row-gap:8px;align-items:start}
  .schein .lbl{grid-column:2}
  .schein .sthumb{grid-column:1;grid-row:1/3;width:120px;height:78px;font-size:11px;border-radius:10px}
  .schein .sbtns{grid-column:2}
  h2{font-size:23px}
  .amp{padding:18px}
  .list{padding:4px 16px}
  .tl{gap:10px}
  .entry{padding:14px 16px;gap:8px 14px}
  .toast{bottom:calc(24px + var(--sb))}
  dialog{padding:20px}
}
@media(max-width:620px){.grid3{grid-template-columns:1fr}}
@media(max-width:480px){.frow{flex-direction:column;gap:0}.doc{flex-basis:100%}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="mtop">
    <div class="mrow"><button class="mv" data-a="menu" aria-label="Menü öffnen" style="color:var(--txt)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="mlogo cond" id="mlogo"></span></div>
    <div class="mveh" id="mveh"></div>
    <nav class="mnav" id="mnav" aria-label="Bereiche"></nav>
  </header>
  <aside id="side">
    <div class="logo cond" style="display:flex;align-items:center;gap:12px"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="44" height="44" aria-hidden="true"><defs><radialGradient id="lg-bg" cx="50%" cy="30%" r="80%"><stop offset="0" stop-color="#202830"/><stop offset="1" stop-color="#0A0D10"/></radialGradient><linearGradient id="lg-h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD683"/><stop offset="1" stop-color="#FF9114"/></linearGradient><linearGradient id="lg-in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1D1710"/><stop offset="1" stop-color="#4B3112"/></linearGradient><radialGradient id="lg-l" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FFF3C9" stop-opacity=".95"/><stop offset="1" stop-color="#FFB43B" stop-opacity="0"/></radialGradient></defs><rect width="96" height="96" rx="22" fill="url(#lg-bg)"/><path d="M12 45L48 16l36 29v37H12z" fill="url(#lg-h)"/><path d="M12 45L48 16l36 29" fill="none" stroke="#FFF1C7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="46" width="48" height="36" rx="2.5" fill="url(#lg-in)"/><ellipse cx="37" cy="73" rx="11" ry="8" fill="url(#lg-l)"/><ellipse cx="59" cy="73" rx="11" ry="8" fill="url(#lg-l)"/><circle cx="37" cy="73" r="2.8" fill="#FFF7DA"/><circle cx="59" cy="73" r="2.8" fill="#FFF7DA"/><rect x="43" y="72" width="10" height="2.4" rx="1.2" fill="#8A5E20"/><g fill="#FFB43B"><rect x="24" y="46" width="48" height="5.2" rx="1.2"/><rect x="24" y="52.6" width="48" height="5.2" rx="1.2"/><rect x="24" y="59.2" width="48" height="5.2" rx="1.2"/></g><rect x="24" y="64.8" width="48" height="2.4" rx="1.2" fill="#C26A0B"/></svg><span>MyGarage</span></div>
    <div class="col" id="vblock" style="gap:8px"><div class="lbl" style="padding:0 8px">Fahrzeug</div><div id="vlist" class="col" style="gap:8px"></div></div>
    <nav class="col" id="navblock" style="gap:6px"><div class="lbl" style="padding:0 8px 4px">Bereiche</div><div id="nav" class="col" style="gap:6px"></div></nav>
    <div class="col" style="gap:8px;margin-top:auto">
      <div id="trashnav"></div>
      <div style="height:1px;background:var(--line);margin:6px 0 10px"></div>
      <div class="lbl" style="padding:0 8px">Datensicherung</div>
      <button class="ghost" data-a="export">Sicherung exportieren</button>
      <button class="ghost" data-a="import">Sicherung importieren</button>
      <span id="lastbk" class="mut" style="font-size:13px;padding:0 8px"></span>
      <input type="file" id="impfile" hidden>
    </div>
  </aside>
  <main id="main"></main>
  <div class="scrim" data-a="menuclose"></div>
</div>

<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="pick" hidden>

<script>
"use strict";
var KEY = "mygarage-weitergabe-v1";
var CATS = { wartung:"Wartung", reparatur:"Reparatur", tuev:"TÜV / Behörde", tuning:"Tuning / Umbau" };
var SPECS = [["oel","Ölsorte / Freigabe"],["druck","Reifendruck"],["wischer","Scheibenwischer"],["farbe","Farbcode"],["hsn","HSN / TSN"],["reifen","Reifengröße"]];
var TRASH_DAYS = 30, BACKUP_DAYS = 30;
var ICON_CLIP = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.9-8.9a3.7 3.7 0 0 1 5.2 5.2l-8.9 8.9a1.8 1.8 0 0 1-2.6-2.6l8.2-8.2"/></svg>';
var ICON_COPY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
var CARD_TIP = "Antippen: bearbeiten · Halten und ziehen: verschieben";

/* ---------- Hilfsfunktionen ---------- */
function $(id){ return document.getElementById(id); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function pad(n){ return String(n).padStart(2,"0"); }
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function today(){ return isoOf(new Date()); }
function dayNum(iso){ var p=String(iso||"").split("-"); if(p.length!==3) return NaN; return Date.UTC(+p[0],+p[1]-1,+p[2])/86400000; }
function daysBetween(a,b){ var x=dayNum(a), y=dayNum(b); return (isNaN(x)||isNaN(y)) ? 0 : Math.round(y-x); }
function addMonths(iso,m){ var p=String(iso||"").split("-"); if(p.length!==3) return ""; var d=new Date(+p[0],+p[1]-1+Number(m),1); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(+p[2],last)); return isoOf(d); }
function esc(t){ return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function fmtKm(n){ return (Number(n)||0).toLocaleString("de-DE")+" km"; }
function fmtDate(iso){ if(!iso) return "–"; var p=String(iso).split("-"); return p.length===3 ? p[2]+"."+p[1]+"."+p[0] : String(iso); }
function fmtMonth(iso){ if(!iso) return ""; var p=String(iso).split("-"); return p[1]+"/"+p[0]; }
function fmtZ(n,d){ return Number(n).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtEur(n){ return fmtZ(n,2)+" €"; }
function fmtInput(n){ return (n==null||n==="") ? "" : String(n).replace(".",","); }
function parseNum(x){
  if(x==null) return null;
  if(typeof x==="number") return isFinite(x)?x:null;
  var s=String(x).replace(/euro|eur|€|\s/gi,"");
  if(!s) return null;
  if(s.indexOf(",")>=0) s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,"");
  if(!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return parseFloat(s);
}
function isMobile(){ return window.matchMedia && matchMedia("(max-width:820px)").matches; }

/* ---------- Datenmodell ---------- */
function defaultFaell(){ return [
  {id:uid(),k:"d-tuev",titel:"TÜV / HU",typ:"datum",wert:"",wert2:"",info:""},
  {id:uid(),k:"d-insp",titel:"Inspektion",typ:"beides",wert:"",wert2:"",info:""},
  {id:uid(),k:"d-oel",titel:"Ölwechsel",typ:"km",wert:"",wert2:"",info:""},
  {id:uid(),k:"d-sommer",titel:"Sommerreifen",typ:"reifen",wert:"",wert2:"",info:""},
  {id:uid(),k:"d-winter",titel:"Winterreifen",typ:"reifen",wert:"",wert2:"",info:""} ]; }
function defaultSpecs(old){ old=old||{}; return SPECS.map(function(x){ return {id:uid(),k:"s-"+x[0],label:x[1],value:old[x[0]]||"",type:"text"}; }); }
function blankVehicle(name){ return { id:uid(), name:name, kz:"", fin:"", km:0, schein:["",""], faell:defaultFaell(), specList:defaultSpecs(), lists:{}, log:[], zettel:[], tank:[] }; }
function copyField(sp){ return {id:uid(),k:sp.k,label:sp.label,value:"",type:sp.type||"text"}; }
function vehicleFrom(tpl,name){
  var v=blankVehicle(name); if(!tpl) return v;
  v.faell=tpl.faell.map(function(f){ return {id:uid(),k:f.k,titel:f.titel,typ:f.typ,wert:"",wert2:"",info:"",intM:f.intM,intKm:f.intKm}; });
  v.specList=tpl.specList.map(copyField);
  Object.keys(tpl.lists||{}).forEach(function(a){ v.lists[a]=(tpl.lists[a]||[]).map(copyField); });
  return v;
}
function mig4Entry(e){
  if(!Array.isArray(e.files)){ e.files=e.beleg?[e.beleg]:[]; delete e.beleg; }
  if(typeof e.cost==="string"){ var c=e.cost.trim(); if(!c) e.cost=null; else { var n=parseNum(c); if(n==null){ e.note=(e.note?e.note+" · ":"")+"Kosten: "+c; e.cost=null; } else e.cost=n; } }
  if(e.cost===undefined) e.cost=null;
  if(e.note==null) e.note="";
}
function mig4Zettel(z){ if(z.file===undefined){ z.file=z.img||""; delete z.img; } }
function fixVehicle(v){
  if(!v.specList) v.specList=defaultSpecs(v.specs);
  delete v.foto; delete v.specs; delete v.vers;
  if(!Array.isArray(v.schein)) v.schein=[typeof v.schein==="string"?v.schein:"",""];
  v.faell=v.faell||[]; v.log=v.log||[]; v.zettel=v.zettel||[]; v.tank=v.tank||[]; v.lists=v.lists||{};
  v.log.forEach(mig4Entry); v.zettel.forEach(mig4Zettel);
}
function linkKeys(s){
  var fk={}, sk={}, ak={};
  function give(map,name,used){ var k=map[name]; if(!k||used[k]) k=uid(); if(!map[name]) map[name]=k; used[k]=1; return k; }
  s.vehicles.forEach(function(v){
    var u1={}, u2={}, u3={};

function normalize(s){

var DB=null, TH={}, VIEWURLS=[];
function dbOpen(){

    setTimeout(fin,4000);
    try {
      var r=indexedDB.open("mygarage-weitergabe-dateien",1);
      r.onupgradeneeded=function(){ var db=r.result; if(!db.objectStoreNames.contains("meta")) db.createObjectStore("meta",{keyPath:"id"}); if(!db.objectStoreNames.contains("full")) db.createObjectStore("full",{keyPath:"id"}); };
      r.onsuccess=function(){ if(done){ try{ r.result.close(); }catch(e){} return; } DB=r.result; fin(); };
      r.onerror=fin; r.onblocked=fin;
    } catch(e){ fin(); }
  });

function dbTx(stores,mode,fn){
  return new Promise(function(res,rej){
    var tx=DB.transaction(stores,mode), req=fn(tx);
    tx.oncomplete=function(){ res(req && req.result!==undefined ? req.result : undefined); };
    tx.onerror=function(){ rej(tx.error); }; tx.onabort=function(){ rej(tx.error); };
  });
}
function metaLoad(){ if(!DB) return Promise.resolve(); return dbTx(["meta"],"readonly",function(tx){ return tx.objectStore("meta").getAll(); }).then(function(all){ (all||[]).forEach(function(m){ TH[m.id]={kind:m.kind,name:m.name||"",thumb:m.thumb||""}; }); }); }

function eachRef(fn){

  function entry(e){ if(Array.isArray(e.files)) e.files=e.files.map(fn).filter(Boolean); }

  S.trash.forEach(function(t){ if(!t.data) return; if(t.type==="fahrzeug") veh(t.data); else if(t.type==="eintrag") entry(t.data); else if(t.type==="zettel") zet(t.data); });

    .then(function(){ del.forEach(function(id){ delete TH[id]; }); }).catch(function(){});

function scaleImg(img,max,q){ var s=Math.min(1,max/Math.max(img.width,img.height)); var c=document.createElement("canvas"); c.width=Math.max(1,Math.round(img.width*s)); c.height=Math.max(1,Math.round(img.height*s)); c.getContext("2d").drawImage(img,0,0,c.width,c.height); return c.toDataURL("image/jpeg",q); }

function readData(f){ return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; r.readAsDataURL(f); }); }

/* ---------- Fälligkeits-Ampel ---------- */
var RANK={none:0,ok:1,warn:2,bad:3};
var LABEL={ ok:"In Ordnung", warn:"Bald fällig", bad:"Überfällig" };
function dateRes(w){
  var days=daysBetween(today(),w), base="fällig "+fmtMonth(w)+" ("+fmtDate(w)+")";
  if (days<0) return { c:"bad", t:base+" · seit "+(-days)+" Tagen" };
  if (days===0) return { c:"warn", t:base+" · heute" };
  if (days<=60) return { c:"warn", t:base+" · in "+days+" Tagen" };
  return { c:"ok", t:base+" · in "+Math.round(days/30.4)+" Monaten" };
}
function fieldRes(w){
  var days=daysBetween(today(),w), base="am "+fmtDate(w), c=days<0?"bad":(days<=60?"warn":"ok");
  var t = days<0 ? base+" · seit "+(-days)+" Tagen" : days===0 ? base+" · heute" : days<=60 ? base+" · in "+days+" Tagen" : base+" · in "+Math.round(days/30.4)+" Monaten";
  return { c:c, s:LABEL[c], i:t };
}
function kmRes(w,v){
  var rest=Number(w)-Number(v.km), t="bei "+fmtKm(w);
  if (rest<0) return { c:"bad", t:t+" · "+fmtKm(-rest)+" drüber" };
  if (rest<=1000) return { c:"warn", t:t+" · in "+fmtKm(rest) };
  return { c:"ok", t:t+" · in "+fmtKm(rest) };
}
function ampel(f, v){
  if (f.typ==="reifen"){
    if (!f.wert) return { c:"none", s:"Nicht festgelegt", i:"DOT-Jahr eintragen" };
    var age=new Date().getFullYear()-Number(f.wert);
    var txt=(f.info?f.info+" · ":"")+"DOT "+f.wert+" · "+age+(age===1?" Jahr":" Jahre")+" alt";
    if (age>=8) return { c:"bad", s:"Tauschen", i:txt };
    if (age>=6) return { c:"warn", s:"Bald tauschen", i:txt };
    return { c:"ok", s:"In Ordnung", i:txt };
  }
  var parts=[];
  if ((f.typ==="datum"||f.typ==="beides") && f.wert) parts.push(dateRes(f.wert));
  var kmw = f.typ==="beides" ? f.wert2 : f.wert;
  if ((f.typ==="km"||f.typ==="beides") && kmw) parts.push(kmRes(kmw,v));
  if (!parts.length) return { c:"none", s:"Nicht festgelegt", i:"Fälligkeit eintragen" };
  var worst=parts.reduce(function(x,y){ return RANK[y.c]>RANK[x.c]?y:x; });
  return { c:worst.c, s:LABEL[worst.c], i:parts.map(function(p){return p.t;}).join("  ·  oder  ·  ") };
}
function fieldDates(v){
  var out=[];
  v.specList.forEach(function(sp){ if(sp.type==="date" && sp.value) out.push({label:sp.label,area:"Fahrzeugdaten",view:"tresor",a:fieldRes(sp.value)}); });
  S.areas.forEach(function(ar){ ((v.lists||{})[ar.id]||[]).forEach(function(sp){ if(sp.type==="date" && sp.value) out.push({label:sp.label,area:ar.name,view:"area:"+ar.id,a:fieldRes(sp.value)}); }); });
  return out;
}

/* ---------- Tankbuch ---------- */
function tankStats(v){
  var rows=(v.tank||[]).map(function(e){ return {id:e.id,d:e.d,km:Number(e.km)||0,liter:Number(e.liter)||0,cost:Number(e.cost)||0,voll:e.voll!==false,verbrauch:null}; })
    .sort(function(a,b){ return a.km-b.km || (a.d||"").localeCompare(b.d||""); });
  var lastKm=null, acc=0, sumL=0, sumKm=0;
  rows.forEach(function(r){ acc+=r.liter;
    if(r.voll){ if(lastKm!==null && r.km>lastKm){ r.verbrauch=acc/(r.km-lastKm)*100; sumL+=acc; sumKm+=r.km-lastKm; } lastKm=r.km; acc=0; } });
  var cost=0, lit=0; rows.forEach(function(r){ cost+=r.cost; if(r.cost) lit+=r.liter; });
  var fuelKm=rows.length>1?rows[rows.length-1].km-rows[0].km:0;
  return { rows:rows, n:rows.length, cost:cost, avg:sumKm>0?sumL/sumKm*100:null, ppl:lit>0?cost/lit:null, costPerKm:(fuelKm>0&&cost>0)?cost/fuelKm*100:null };
}
function costYears(v){
  var m={};
  function add(d,key,n){ if(!d||!n) return; var y=String(d).slice(0,4); m[y]=m[y]||{h:0,t:0}; m[y][key]+=n; }
  v.log.forEach(function(e){ if(e.cost!=null) add(e.d,"h",Number(e.cost)||0); });
  (v.tank||[]).forEach(function(e){ add(e.d,"t",Number(e.cost)||0); });
  return Object.keys(m).sort().reverse().map(function(y){ return {y:y,h:m[y].h,t:m[y].t}; });
}

/* ---------- Papierkorb ---------- */
var TRASH_TYPES={ fahrzeug:"Fahrzeug", faell:"Fälligkeit", eintrag:"Fahrzeughistorie-Eintrag", zettel:"Zettel", tank:"Tankvorgang", spec:"Feld", bereich:"Bereich", tankbereich:"Bereich", kategorie:"Kategorie (Fahrzeughistorie)" };
function toTrash(type,label,data,veh,list){ var id=uid(); S.trash.unshift({ id:id, type:type, label:label, data:data, list:list||"", vid:veh?veh.id:"", vname:veh?veh.name:"", at:today() }); return id; }

function expireTrash(){ S.trash=S.trash.filter(function(t){ return daysBetween(t.at,today())<=TRASH_DAYS; }); }
function restore(id){
  var t=S.trash.find(function(x){return x.id===id;}); if(!t) return;
  if (t.type==="fahrzeug"){ S.vehicles=S.vehicles.filter(function(x){ return !(x.auto && !vehHasData(x)); }); S.vehicles.push(t.data); S.sel=t.data.id; }
  else if (t.type==="bereich"){
    if(!S.areas.some(function(a){return a.id===t.data.area.id;})) S.areas.push(t.data.area);
    Object.keys(t.data.lists||{}).forEach(function(vid){ var vv=S.vehicles.find(function(x){return x.id===vid;}); if(vv){ vv.lists=vv.lists||{}; vv.lists[t.data.area.id]=t.data.lists[vid]; } });
  }
  else if (t.type==="tankbereich"){ S.tankOn=true; Object.keys(t.data.lists||{}).forEach(function(vid){ var vv=S.vehicles.find(function(x){return x.id===vid;}); if(vv) vv.tank=(vv.tank||[]).concat(t.data.lists[vid]); }); }
  else if (t.type==="kategorie"){ if(!catKnown(t.data.id)) S.cats.push(t.data); }
  else {
    var veh=S.vehicles.find(function(x){return x.id===t.vid;});

function guessFaell(title,cat,opts){
  var t=String(title||"").toLowerCase();
  for(var i=0;i<opts.length;i++){
    var words=String(opts[i].titel).toLowerCase().split(/[^a-zäöüß]+/).filter(function(w){ return w.length>=3; });
    if(words.some(function(w){ return t.indexOf(w)>=0; })) return opts[i].id;
  }
  if(cat==="tuev"){ var f=opts.find(function(o){ return /tüv|\bhu\b/i.test(o.titel); }); if(f) return f.id; }
  return "";
}

  refs.reduce(function(p,r){ return p.then(function(){ return fileFull(r).then(function(d){ var id=r.slice(2), m=TH[id]; if(d && m) files[id]={kind:m.kind,name:m.name,thumb:m.thumb,full:d}; }); }); },Promise.resolve())
  .then(function(){
    var out={app:"MyGarage",format:2,exported:today(),data:S,files:files};
    var name="MyGarage-Sicherung-"+today()+".json", json=JSON.stringify(out);
    var blob=new Blob([json],{type:"application/json"}), url=URL.createObjectURL(blob);
    VIEWURLS.push(url);
    var file=null; try { file=new File([json],name,{type:"application/json"}); } catch(e){}
    shareFile=null; try { if(file && navigator.canShare && navigator.canShare({files:[file]})) shareFile=file; } catch(e){}
    var ios=isIOS() && !!shareFile;
    var hint=ios ? 'Tippe auf „In Dateien sichern“. Im nächsten Fenster wählst du „In Dateien sichern“ und dann einen Ordner, zum Beispiel „Auf meinem iPhone“. Bewahre die Datei gut auf, zum Beispiel zusätzlich per E-Mail an dich selbst.'
      : 'Die Datei landet im Ordner „Downloads“. Bewahre sie gut auf, zum Beispiel per E-Mail an dich selbst, und kopiere sie bei einem Handywechsel auf das neue Handy.';
    var dl='<a class="'+(ios?'ghost':'prim')+'" style="display:inline-flex;align-items:center;text-decoration:none" href="'+url+'" download="'+name+'" data-a="bkdone">Herunterladen</a>';
    var sh=shareFile?'<button type="button" class="'+(ios?'prim':'ghost')+'" data-a="bkshare">'+(ios?'In Dateien sichern':'Teilen')+'</button>':'';
    open('<div><h2>Sicherung ist bereit</h2><p class="mut2" style="margin:0 0 16px">Größe: '+fmtZ(blob.size/1048576,1)+' MB. '+hint+'</p>'
      + '<div class="acts"><button type="button" class="ghost" data-a="close">Abbrechen</button>'+(ios?dl+sh:sh+dl)+'</div></div>');
  }).catch(function(){ toast("Die Sicherung konnte nicht erstellt werden."); });
}
function importData(text){
  var d; try { d=JSON.parse(text); } catch(e){ toast("Diese Datei ist keine gültige Sicherung."); return; }
  var data=null, files={};
  if(d && d.app==="MyGarage" && d.data){ data=d.data; files=d.files||{}; } else if(d && d.vehicles){ data=d; }
  if(!data || !Array.isArray(data.vehicles) || !data.vehicles.length){ toast("Diese Datei ist keine gültige Sicherung."); return; }
  if(hasData() && !confirm("Alle aktuellen Daten auf diesem Gerät durch die Sicherung ersetzen?")) return;
  var ids=Object.keys(files).filter(function(id){ var f=files[id]; return f && /^[a-z0-9]+$/i.test(id) && (f.kind==="img"||f.kind==="pdf") && typeof f.full==="string" && f.full.indexOf("data:")===0; });
  var write = (DB && ids.length) ? dbTx(["meta","full"],"readwrite",function(tx){ ids.forEach(function(id){ var f=files[id]; tx.objectStore("meta").put({id:id,kind:f.kind,name:String(f.name||""),thumb:safeImg(f.thumb)}); tx.objectStore("full").put({id:id,data:f.full}); }); })
      .then(function(){ ids.forEach(function(id){ var f=files[id]; TH[id]={kind:f.kind,name:String(f.name||""),thumb:safeImg(f.thumb)}; }); })
    : Promise.resolve();
  write.then(function(){
    S=normalize(data); S.view="dash"; S.filter="alle"; if(d.app==="MyGarage" && d.exported) S.lastBackup=d.exported;
    if(!DB) eachRef(function(r){ if(r && r.indexOf("f:")===0 && files[r.slice(2)] && ids.indexOf(r.slice(2))>=0) return files[r.slice(2)].full; return r; });
    return moveInline();
  }).then(function(){ save(); return gc(); }).then(function(){ render(); toast("Sicherung importiert"); })
    .catch(function(){ toast("Die Sicherung konnte nicht geladen werden."); });
}

  var t=$("toast"); t.innerHTML='<span>'+esc(m)+'</span>'+(undo?'<button type="button" data-a="undo">Rückgängig</button>':'');
  undoFn=undo||null; t.classList.toggle("act",!!undo); t.classList.add("show");
  clearTimeout(toast.h); toast.h=setTimeout(function(){ t.classList.remove("show","act"); undoFn=null; }, ms||(undo?6000:2400));
}

/* ---------- Halten und ziehen ---------- */
var HOLD_MS=250, MOUSE_MOVE=10, press=null, suppressClick=false;
function cardAt(x,y,list,skip){ skip.style.pointerEvents="none"; var el=document.elementFromPoint(x,y); skip.style.pointerEvents=""; var c=el&&el.closest?el.closest("[data-card]"):null; return (c&&c!==skip&&c.dataset.card===list)?c:null; }
function pressEnd(){ if(press){ clearTimeout(press.t); press=null; } }
document.addEventListener("pointerdown",function(e){
  if(e.button>0 || dlg.open) return;
  var c=e.target.closest?e.target.closest("[data-card]"):null; if(!c) return;
  var ex=e.target.closest("input,button,a,select,textarea"); if(ex && ex!==c) return;
  pressEnd();
  var p={c:c,x:e.clientX,y:e.clientY,drag:false,mouse:e.pointerType==="mouse"};
  p.lift=function(){ if(press!==p||p.drag) return; clearTimeout(p.t); p.drag=true; var r0=c.getBoundingClientRect(); p.gx=p.x-r0.left; p.gy=p.y-r0.top; c.classList.add("lift"); if(navigator.vibrate) try{navigator.vibrate(15);}catch(x){} };
  p.t=setTimeout(p.lift,HOLD_MS);
  press=p;
});
document.addEventListener("pointermove",function(e){
  if(!press) return;
  var dist=Math.hypot(e.clientX-press.x,e.clientY-press.y);
  if(!press.drag){
    if(press.mouse){ if(dist>MOUSE_MOVE) press.lift(); }
    else if(dist>12) pressEnd();
    if(!press || !press.drag) return;
  }
  dragStep(e.clientX,e.clientY);
});
function placeDragged(x,y){
  var c=press.c; c.style.transform="none"; var r=c.getBoundingClientRect();
  c.style.transform="translate("+(x-press.gx-r.left)+"px,"+(y-press.gy-r.top)+"px) scale(1.03)";
}
function dragStep(x,y){
  var c=press.c, list=c.dataset.card, t=cardAt(x,y,list,c);
  if(t){
    c.style.transform="none";
    var cr=c.getBoundingClientRect(), tr=t.getBoundingClientRect();
    var after=!!(c.compareDocumentPosition(t) & Node.DOCUMENT_POSITION_FOLLOWING);
    var sameRow=Math.abs(tr.top-cr.top)<cr.height/2;
    var past = sameRow ? (after ? x>tr.left+tr.width/2 : x<tr.left+tr.width/2) : (after ? y>tr.top+tr.height/2 : y<tr.top+tr.height/2);
    if(past){
      var sibs=[].slice.call(document.querySelectorAll('[data-card="'+list+'"]')).filter(function(n){return n!==c;});
      var first=sibs.map(function(n){return n.getBoundingClientRect();});
      if(after) t.after(c); else t.before(c);
      sibs.forEach(function(n,k){ var l=n.getBoundingClientRect(), dx=first[k].left-l.left, dy=first[k].top-l.top;
        if(dx||dy){ n.style.transition="none"; n.style.transform="translate("+dx+"px,"+dy+"px)"; void n.offsetWidth;
          n.style.transition="transform .16s ease"; n.style.transform=""; setTimeout(function(){ n.style.transition=""; },200); } });
    }
  }
  placeDragged(x,y);
}
document.addEventListener("pointerup",function(e){
  if(!press) return;
  var p=press; pressEnd();
  var lst=p.c.dataset.card;
  if(p.drag){
    var ids=[].slice.call(document.querySelectorAll('[data-card="'+lst+'"]')).map(function(n){return n.dataset.id;});
    if(lst==="nav") S.navOrder=ids; else if(lst==="tankstat") S.tankCards=ids;
    else { var arr=listOf(cur(),lst); arr.sort(function(a,b){ return ids.indexOf(a.id)-ids.indexOf(b.id); }); }
    save(); render();
    suppressClick=true; setTimeout(function(){ suppressClick=false; },60);
  }
});
document.addEventListener("click",function(e){ if(suppressClick){ suppressClick=false; e.stopImmediatePropagation(); e.preventDefault(); } },true);
document.addEventListener("pointercancel",function(){ if(press){ var d=press.drag; pressEnd(); if(d) render(); } });
document.addEventListener("touchmove",function(e){ if(press && press.drag) e.preventDefault(); },{passive:false});
document.addEventListener("contextmenu",function(e){ if(e.target.closest && e.target.closest("[data-card]") && !e.target.closest("input")) e.preventDefault(); });
